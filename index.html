function parseNum(input) {
    if (typeof input === "number")
        return isFinite(input) ? input : 0;
    if (!input)
        return 0;
    let t = String(input).trim().replace(/[R$US€\s]/gi, "");
    const temVirgula = t.includes(",");
    const temPonto = t.includes(".");
    if (temVirgula && temPonto) {
        // O último separador que aparece é o decimal
        t = t.lastIndexOf(",") > t.lastIndexOf(".")
            ? t.replace(/\./g, "").replace(",", ".")
            : t.replace(/,/g, "");
    }
    else if (temVirgula) {
        t = t.replace(",", ".");
    }
    else if (temPonto) {
        // "1.234" com 3 dígitos após o ponto e sem outro ponto = separador de milhar
        const partes = t.split(".");

            t = partes.join("");

    const n = parseFloat(t);

}

function moneyCompact(v, currency) {

        { limite: 1e9, div: 1e9, sufixo: " bi" },
        { limite: 1e6, div: 1e6, sufixo: " mi" },

}

    if (abs >= 1e9)
