function isoDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function todayIso() { return new Date().toISOString().slice(0, 10); }
function nowHM() { const d = new Date(); return d.toTimeString().slice(0, 5); }
function fmtDate(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }); }
function monthYear(iso) { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }); }
function sum(arr) { return arr.reduce((a, b) => a + b, 0); }

function inPeriod(dateIso, period) {
  if (!dateIso) return false;
  const d = new Date(dateIso + "T00:00:00");
  const ref = new Date(period.ref + "T00:00:00");
  if (period.type === "dia") return dateIso === period.ref;
  if (period.type === "semana") {
    const start = new Date(ref); start.setDate(ref.getDate() - ref.getDay());
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return d >= start && d <= end;
  }
  if (period.type === "mes") return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
  if (period.type === "ano") return d.getFullYear() === ref.getFullYear();
  return true;
}

function diplomaMeta(d) {
  const period = d.dataInicio && d.dataFim ? `${monthYear(d.dataInicio)} – ${monthYear(d.dataFim)}` : "";
  let duration = "";
  if (d.tipo === "Formação" || d.tipo === "Pós-graduação") {
    if (d.dataInicio && d.dataFim) {
      const anos = (new Date(d.dataFim) - new Date(d.dataInicio)) / (1000 * 60 * 60 * 24 * 365.25);
      duration = `${anos.toFixed(1)} anos`;
    }
  } else if (d.horas) duration = `${d.horas}h`;
  return [period, duration].filter(Boolean).join(" · ");
}

/* Gráficos em SVG puro — sem biblioteca externa, funcionam em qualquer navegador */
function MiniLine({ data, dataKey, color, xKey = "date" }) {
  const w = 600, h = 140, padX = 20, padY = 16;
  const values = data.map((d) => Number(d[dataKey]) || 0);
  const max = Math.max(...values, 1), min = Math.min(0, ...values);
  const range = max - min || 1;
  const stepX = data.length > 1 ? (w - padX * 2) / (data.length - 1) : 0;
  const toXY = (v, i) => [padX + i * stepX, h - padY - ((v - min) / range) * (h - padY * 2)];
  const points = values.map((v, i) => toXY(v, i).join(",")).join(" ");
  const showEvery = Math.max(1, Math.ceil(data.length / 6));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: h, display: "block" }}>
      <line x1={padX} y1={h - padY} x2={w - padX} y2={h - padY} stroke={C.border} strokeWidth="1" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
      {values.map((v, i) => { const [x, y] = toXY(v, i); return <circle key={i} cx={x} cy={y} r="2.5" fill={color} />; })}
      {data.map((d, i) => (i % showEvery === 0 ? <text key={i} x={toXY(values[i], i)[0]} y={h - 2} fontSize="9" fill={C.textMuted} textAnchor="middle">{d[xKey]}</text> : null))}
    </svg>
  );
}
function MiniBar({ data, dataKey, color, xKey = "name" }) {
  const w = 600, h = 160, padX = 20, padY = 16, gap = 8;
  const values = data.map((d) => Number(d[dataKey]) || 0);
  const max = Math.max(...values, 1);
  const barW = data.length ? (w - padX * 2 - gap * (data.length - 1)) / data.length : 0;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: h, display: "block" }}>
      <line x1={padX} y1={h - padY} x2={w - padX} y2={h - padY} stroke={C.border} strokeWidth="1" />
      {data.map((d, i) => {
        const v = values[i];
        const barH = (v / max) * (h - padY * 2 - 14);
        const x = padX + i * (barW + gap);
        const y = h - padY - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx="2" fill={color} />
            <text x={x + barW / 2} y={h - 2} fontSize="9" fill={C.textMuted} textAnchor="middle">{String(d[xKey]).slice(0, 10)}</text>
          </g>
        );
      })}
    </svg>
  );
}
function GroupedBar({ data, keys, colors, xKey }) {
  const w = 600, h = 160, padX = 20, padY = 16, groupGap = 16, barGap = 3;
  const max = Math.max(1, ...data.flatMap((d) => keys.map((k) => Number(d[k]) || 0)));
  const groupW = data.length ? (w - padX * 2 - groupGap * (data.length - 1)) / data.length : 0;
  const barW = (groupW - barGap * (keys.length - 1)) / keys.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: h, display: "block" }}>
      <line x1={padX} y1={h - padY} x2={w - padX} y2={h - padY} stroke={C.border} strokeWidth="1" />
      {data.map((d, gi) => {
        const gx = padX + gi * (groupW + groupGap);
        return (
          <g key={gi}>
            {keys.map((k, ki) => {
              const v = Number(d[k]) || 0;
              const barH = (v / max) * (h - padY * 2 - 14);
              const x = gx + ki * (barW + barGap);
              const y = h - padY - barH;
              return <rect key={k} x={x} y={y} width={barW} height={barH} rx="2" fill={colors[ki]} />;
            })}
            <text x={gx + groupW / 2} y={h - 2} fontSize="9" fill={C.textMuted} textAnchor="middle">{d[xKey]}</text>
          </g>
        );
      })}
    </svg>
  );
}

  const [values, setValues] = useState({});
  const [feed, setFeed] = useState([]);

  const fields = CATEGORY_FIELDS[domain][category] || [];

  function changeDomain(d) {
    setDomain(d);
    setCategory(Object.keys(CATEGORY_FIELDS[d])[0]);
    setValues({});
  }

  function submit(e) {
    e.preventDefault();
    let summary = category;

    if (domain === "financeiro" && category === "Conta bancária") {
      const isSaida = (values.operacao || "").toLowerCase().startsWith("sa");
      const delta = isSaida ? -Number(values.valor || 0) : Number(values.valor || 0);
      const acc = data.accounts.find((a) => a.name.toLowerCase() === (values.conta || "").toLowerCase());
      setData((d) => ({
        ...d,
        accounts: acc ? d.accounts.map((a) => a.id === acc.id ? { ...a, balance: a.balance + delta } : a)
          : [...d.accounts, { id: Date.now(), name: values.conta, balance: delta }],
        transactions: [...d.transactions, { id: Date.now(), date, conta: values.conta, operacao: isSaida ? "Saída" : "Entrada", categoria: "Manual", valor: Number(values.valor || 0) }],
      }));
      summary = `${values.operacao || ""} R$ ${values.valor || 0} — ${values.conta || ""}`;
    }
    if (domain === "financeiro" && category === "Criptomoeda") {
      setData((d) => ({ ...d, cryptoPurchases: [...d.cryptoPurchases, { id: Date.now(), date, coin: (values.moeda || "").toUpperCase(), brlSpent: Number(values.valorPago || 0), quantity: Number(values.quantidade || 0) }] }));
      summary = `Compra de ${values.quantidade || 0} ${values.moeda || ""} por R$ ${values.valorPago || 0}`;
    }
    if (domain === "financeiro" && category === "Ação / investimento") {
      const inv = data.investments.find((i) => i.name.toLowerCase() === (values.nome || "").toLowerCase());
      setData((d) => ({ ...d, investments: inv ? d.investments.map((i) => i.id === inv.id ? { ...i, quantity: i.quantity + Number(values.quantidade || 0) } : i) : [...d.investments, { id: Date.now(), name: values.nome, quantity: Number(values.quantidade || 0) }] }));
      summary = `${values.quantidade || 0}x ${values.nome || ""}`;
    }
    if (domain === "conhecimento" && category === "Estudo") {
      setData((d) => ({ ...d, studyRecords: [...d.studyRecords, { id: Date.now(), date, subject: values.materia || "Outros", pages: Number(values.paginas || 0) }] }));
      summary = `${values.materia || ""} — ${values.paginas || 0} páginas`;
    }
    if (domain === "conhecimento" && category === "Leitura") {
      setData((d) => ({ ...d, reading: [...d.reading, { date, pages: Number(values.paginas || 0) }] }));
      summary = `Leitura — ${values.paginas || 0} páginas`;
    }
    if (domain === "conhecimento" && category === "Skill desenvolvida") {
      setData((d) => ({ ...d, skills: [...d.skills, { id: Date.now(), date, nome: values.nome || "", nivel: values.nivel || "", nota: values.nota || "" }] }));
      summary = `Skill — ${values.nome || ""} (${values.nivel || ""})`;
    }
    if (domain === "caridade" && category === "Doação em dinheiro") {
      const acc = data.accounts.find((a) => a.name.toLowerCase() === (values.conta || "").toLowerCase());
      setData((d) => ({
        ...d,
        accounts: acc ? d.accounts.map((a) => a.id === acc.id ? { ...a, balance: a.balance - Number(values.valor || 0) } : a) : d.accounts,
        transactions: [...d.transactions, { id: Date.now(), date, conta: values.conta, operacao: "Saída", categoria: "Doação", valor: Number(values.valor || 0) }],
        charity: [...d.charity, { id: Date.now(), date, description: values.descricao || "Doação em dinheiro", valor: Number(values.valor || 0), conta: values.conta }],
      }));
      summary = `Doação de R$ ${values.valor || 0} — ${values.descricao || ""}`;
    }
    if (domain === "caridade" && category !== "Doação em dinheiro") {
      setData((d) => ({ ...d, charity: [...d.charity, { id: Date.now(), date, description: values.descricao || category }] }));
      summary = values.descricao || category;
    }
    if (domain === "tempo" && category === "Procrastinação") {
      setData((d) => ({ ...d, procrastinationRecords: [...d.procrastinationRecords, { id: Date.now(), date, app: values.app || "Outro", minutes: Number(values.minutos || 0) }] }));
      summary = `${values.minutos || 0} min em ${values.app || "outro app"}`;
    }
    if (domain === "corpo" && category === "Exercício") {
      setData((d) => ({ ...d, exerciseRecords: [...d.exerciseRecords, { id: Date.now(), date, name: values.tipo || "Exercício", minutes: Number(values.minutos || 0) }] }));
      summary = `${values.tipo || "Exercício"} — ${values.minutos || 0} min`;
    }
    if (domain === "corpo" && category === "Água") {
      setData((d) => ({ ...d, waterRecords: [...d.waterRecords, { date, liters: Number(values.ml || 0) }] }));
      summary = `Água — ${values.ml || 0} L`;
    }
    if (domain === "corpo" && category === "Sono") {
      setData((d) => ({ ...d, sleep: [...d.sleep, { date, hours: Number(values.horas || 0) }] }));
      summary = `Sono — ${values.horas || 0}h`;
    }
    if (domain === "corpo" && category === "Peso") {
      setData((d) => ({ ...d, weight: [...d.weight, { date, kg: Number(values.kg || 0) }] }));
      summary = `Peso — ${values.kg || 0} kg`;
    }
    if (domain === "corpo" && category === "Pressão arterial") {
      setData((d) => ({ ...d, bloodPressure: [...d.bloodPressure, { id: Date.now(), date, sistolica: Number(values.sistolica || 0), diastolica: Number(values.diastolica || 0), bpm: Number(values.bpm || 0) }] }));
      summary = `Pressão — ${values.sistolica || 0}/${values.diastolica || 0}`;
    }
    if (domain === "corpo" && category === "Remédio / suplemento") {
      setData((d) => ({ ...d, medications: [...d.medications, { id: Date.now(), date, nome: values.nome || "", dose: values.dose || "", horario: time }] }));
      summary = `${values.nome || ""} — ${values.dose || ""}`;
    }
    if (domain === "corpo" && category === "Alimentação simples") {
      setData((d) => ({ ...d, meals: [...d.meals, { id: Date.now(), date, tipo: values.tipoRefeicao || "Refeição", detalhado: false }] }));
      summary = values.tipoRefeicao || "Refeição";
    }
    if (domain === "corpo" && category === "Alimentação avançada") {
      setData((d) => ({ ...d, meals: [...d.meals, { id: Date.now(), date, tipo: values.alimento || "Refeição", calorias: Number(values.calorias || 0), proteinas: Number(values.proteinas || 0), carboidratos: Number(values.carboidratos || 0), gorduras: Number(values.gorduras || 0), detalhado: true }] }));
      summary = `${values.alimento || ""} — ${values.calorias || 0} kcal`;
    }

    setFeed([{ id: Date.now(), date, time, summary }, ...feed]);
    setValues({});
  }

  return (
    <div>
      <SectionTitle sub="Se fez, registra. Se não fez, também pode registrar — inclusive dias atrasados.">Registrar</SectionTitle>
      <Panel style={{ maxWidth: 560 }}>
        <form onSubmit={submit} className="flex flex-col gap-4">
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>Área</label>
              <select value={domain} onChange={(e) => changeDomain(e.target.value)} className="w-full p-2 rounded" style={inputStyle()}>
                {Object.keys(CATEGORY_FIELDS).map((d) => <option key={d} value={d}>{d[0].toUpperCase() + d.slice(1)}</option>)}
              </select>
            </div>
            <div><label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>Categoria</label>
              <select value={category} onChange={(e) => { setCategory(e.target.value); setValues({}); }} className="w-full p-2 rounded" style={inputStyle()}>
                {Object.keys(CATEGORY_FIELDS[domain]).map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>

          {fields.map((f) => (
            <div key={f.key}>
              <label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>{f.label}</label>
              <input type={f.type} value={values[f.key] || ""} onChange={(e) => setValues({ ...values, [f.key]: e.target.value })} className="w-full p-2 rounded" style={inputStyle()} />
              {domain === "tempo" && category === "Procrastinação" && f.key === "app" && (
                <div className="flex flex-wrap gap-1 mt-2">
                  {["Instagram", "TikTok", "Facebook", "YouTube", "Jogos", "Conversas com IA", "Outro"].map((opt) => (
                    <button key={opt} type="button" onClick={() => setValues({ ...values, app: opt })}
                      className="text-xs px-2 py-1 rounded" style={{ background: C.surfaceAlt, color: C.textMuted, border: `1px solid ${C.border}`, ...sans }}>
                      {opt}
                    </button>
                  ))}
                </div>
              )}
            </div>
          ))}

          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>Data</label>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-2 rounded" style={inputStyle()} />
            </div>
            <div><label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>Horário</label>
              <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full p-2 rounded" style={inputStyle()} />
            </div>
          </div>

          <button type="submit" className="rounded py-2 mt-1" style={{ background: C.sage, color: C.bg, ...sans, fontWeight: 500 }}>Registrar</button>
        </form>
      </Panel>

      {feed.length > 0 && (
        <div className="mt-6">
          <SectionTitle>Registrado nesta sessão</SectionTitle>
          <div className="flex flex-col gap-2">
            {feed.map((f) => (
              <div key={f.id} className="p-3 rounded flex justify-between text-sm" style={{ background: C.surface, ...sans, color: C.text }}>
                <span>{f.summary}</span><span style={{ color: C.textMuted }}>{fmtDate(f.date)} · {f.time}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function Dashboard({ data, hideFinance, period }) {
  const cfg = data.dashboardConfig;
  const p = period.value;
  const now = new Date();

  const pReading = data.reading.filter((r) => inPeriod(r.date, p));
  const pExercise = data.exerciseRecords.filter((r) => inPeriod(r.date, p));
  const pSleep = data.sleep.filter((r) => inPeriod(r.date, p));
  const pWeight = data.weight.filter((r) => inPeriod(r.date, p));
  const pBp = data.bloodPressure.filter((r) => inPeriod(r.date, p));
  const pMood = data.mood.filter((r) => inPeriod(r.date, p));
  const pCharity = data.charity.filter((c) => inPeriod(c.date, p));
  const totalBalance = sum(data.accounts.map((a) => a.balance));
  const doacaoValor = sum(pCharity.filter((c) => c.valor).map((c) => c.valor));

  // Livros lidos: contagem fixa do mês corrente — não muda com o filtro de período.
  const livrosEsteMes = data.books.filter((b) => {
    if (b.status !== "concluído" || !b.dataConclusao) return false;
    const d = new Date(b.dataConclusao + "T00:00:00");
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;

  const cards = [];
  if (cfg.financeiro) cards.push(<StatCard key="fin" icon={Wallet} label="Financeiro" value={<PrivacyValue hide={hideFinance}>R$ {totalBalance}</PrivacyValue>} sub="total em contas" accent={C.bronze} />);
  if (cfg.doacaoModo !== "oculto") cards.push(
    <StatCard key="car" icon={HeartHandshake} label="Caridade"
      value={cfg.doacaoModo === "valor" ? <PrivacyValue hide={hideFinance}>R$ {doacaoValor}</PrivacyValue> : pCharity.length}
      sub={cfg.doacaoModo === "valor" ? "doado no período" : "ações no período"} accent={C.bronze} />
  );
  if (cfg.leitura) cards.push(<StatCard key="lei" icon={BookOpen} label="Leitura" value={`${sum(pReading.map((r) => r.pages))} pág.`} sub="no período" />);
  if (cfg.livros) cards.push(<StatCard key="liv" icon={BookOpen} label="Livros lidos" value={livrosEsteMes} sub={now.toLocaleDateString("pt-BR", { month: "long" })} />);
  if (cfg.exercicio) cards.push(<StatCard key="exe" icon={Activity} label="Exercício" value={`${sum(pExercise.map((r) => r.minutes))} min`} sub="no período" accent={C.bronze} />);
  if (cfg.sono) cards.push(<StatCard key="son" icon={Moon} label="Sono" value={pSleep.length ? `${(sum(pSleep.map((r) => r.hours)) / pSleep.length).toFixed(1)}h` : "—"} sub="média no período" />);
  if (cfg.peso) cards.push(<StatCard key="pes" icon={Activity} label="Peso" value={pWeight.length ? `${pWeight[pWeight.length - 1].kg} kg` : "—"} sub="no período" accent={C.bronze} />);
  if (cfg.pressao) cards.push(<StatCard key="pre" icon={Activity} label="Pressão arterial" value={pBp.length ? `${pBp[pBp.length - 1].sistolica}/${pBp[pBp.length - 1].diastolica}` : "—"} sub="no período" />);
  if (cfg.estado) cards.push(<StatCard key="est" icon={Smile} label="Estado" value={pMood.length ? pMood[pMood.length - 1].mood : "—"} sub="no período" />);

  return (
    <div>
      <div className="flex justify-between items-center mb-3 no-print">
        <SectionTitle sub="Escolha o dia, semana, mês ou ano — o painel inteiro muda para esse período">Dashboard</SectionTitle>
        <button onClick={() => window.print()} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded h-fit" style={{ background: C.surface, color: C.textMuted, border: `1px solid ${C.border}`, ...sans }}>
          <Printer size={13} /> Exportar / imprimir
        </button>
      </div>
      <div className="no-print"><PeriodFilter period={period.value} setPeriod={period.set} /></div>
      <div className="print-area">
        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">{cards}</div>

        <div className="grid md:grid-cols-2 gap-4">
          <Panel><SectionTitle sub="Últimas duas semanas">Trajetória de leitura</SectionTitle><MiniLine data={data.reading.map(r => ({ ...r, date: fmtDate(r.date) }))} dataKey="pages" color={C.sage} /></Panel>
          {cfg.sono ? (
            <Panel><SectionTitle sub="Últimas duas semanas">Trajetória de sono</SectionTitle><MiniLine data={data.sleep.map(s => ({ ...s, date: fmtDate(s.date) }))} dataKey="hours" color={C.bronze} /></Panel>
          ) : (
            <Panel><SectionTitle sub="Últimos 4 registros">Trajetória de peso</SectionTitle><MiniLine data={data.weight.map(w => ({ date: fmtDate(w.date), kg: w.kg }))} dataKey="kg" color={C.bronze} /></Panel>
          )}
        </div>
      </div>
    </div>
  );
}

function Conhecimento({ data, setData, period }) {
  const [form, setForm] = useState({ title: "", author: "", tema: "", totalPages: "", pagesRead: "" });
  const [search, setSearch] = useState("");
  const [results, setResults] = useState([]);
  const [searchStatus, setSearchStatus] = useState("idle"); // idle | loading | ok | error
  const bySubjectAll = {};
  data.studyRecords.forEach((r) => { bySubjectAll[r.subject] = (bySubjectAll[r.subject] || 0) + r.pages; });
  const subjectChart = Object.entries(bySubjectAll).map(([name, pages]) => ({ name, pages }));

  const pReading = data.reading.filter((r) => inPeriod(r.date, period.value));
  const pStudy = data.studyRecords.filter((r) => inPeriod(r.date, period.value));
  const pSkills = data.skills.filter((s) => inPeriod(s.date, period.value));

  async function searchBooks(e) {
    e.preventDefault();
    if (!search.trim()) return;
    setSearchStatus("loading");
    try {
      const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(search)}&limit=5`);
      const json = await res.json();
      setResults((json.docs || []).map((d) => ({
        title: d.title, author: (d.author_name || [])[0] || "", pages: d.number_of_pages_median || "",
      })));
      setSearchStatus("ok");
    } catch (e) { setSearchStatus("error"); }
  }
  function pickResult(r) {
    setForm({ ...form, title: r.title, author: r.author, totalPages: r.pages || "" });
    setResults([]);
  }

  function addBook(e) {
    e.preventDefault();
    if (!form.title) return;
    setData((d) => ({ ...d, books: [...d.books, { id: Date.now(), title: form.title, author: form.author, tema: form.tema, totalPages: Number(form.totalPages || 0), pagesRead: Number(form.pagesRead || 0), status: "lendo" }] }));
    setForm({ title: "", author: "", tema: "", totalPages: "", pagesRead: "" });
  }

  return (
    <div>
      <SectionTitle sub="Livros, estudos e progresso acumulado">Conhecimento</SectionTitle>
      <PeriodFilter period={period.value} setPeriod={period.set} />

      <div className="grid md:grid-cols-2 gap-4 mb-6">
        {data.books.map((b) => {
          const pct = Math.round((b.pagesRead / b.totalPages) * 100);
          return (
            <Panel key={b.id}>
              <div className="flex justify-between items-start">
                <div><div style={{ ...serif, color: C.text, fontSize: 18 }}>{b.title}</div><div className="text-sm" style={{ ...sans, color: C.textMuted }}>{b.author}{b.tema ? ` · ${b.tema}` : ""}</div></div>
                <span className="text-xs px-2 py-1 rounded" style={{ background: C.surfaceAlt, color: C.sage, ...sans }}>{b.status}</span>
              </div>
              <div className="mt-4">
                <div className="h-1.5 rounded-full" style={{ background: C.surfaceAlt }}><div className="h-1.5 rounded-full" style={{ width: `${pct}%`, background: C.sage }} /></div>
                <div className="text-xs mt-1" style={{ ...sans, color: C.textMuted }}>{b.pagesRead} de {b.totalPages} páginas — {pct}%</div>
              </div>
            </Panel>
          );
        })}
      </div>

      <Panel style={{ maxWidth: 520 }} className="mb-6">
        <SectionTitle sub="Busque na Open Library para preencher automaticamente, ou digite manualmente">Adicionar livro</SectionTitle>
        <form onSubmit={searchBooks} className="flex gap-2 mb-3">
          <input placeholder="Buscar título (ex: Sapiens)" value={search} onChange={(e) => setSearch(e.target.value)} className="flex-1 p-2 rounded" style={inputStyle()} />
          <button type="submit" className="px-3 rounded text-xs" style={{ background: C.surfaceAlt, color: C.text, border: `1px solid ${C.border}`, ...sans }}>{searchStatus === "loading" ? "Buscando..." : "Buscar"}</button>
        </form>
        {searchStatus === "error" && <p className="text-xs mb-3" style={{ color: C.danger, ...sans }}>Não consegui consultar a Open Library agora.</p>}
        {results.length > 0 && (
          <div className="flex flex-col gap-1 mb-4">
            {results.map((r, i) => (
              <button key={i} onClick={() => pickResult(r)} className="text-left text-xs p-2 rounded" style={{ background: C.surfaceAlt, color: C.text, border: `1px solid ${C.border}`, ...sans }}>
                {r.title} {r.author ? `— ${r.author}` : ""} {r.pages ? `(${r.pages} pág.)` : ""}
              </button>
            ))}
          </div>
        )}
        <form onSubmit={addBook} className="grid grid-cols-2 gap-3">
          <input placeholder="Título" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className="p-2 rounded col-span-2" style={inputStyle()} />
          <input placeholder="Autor" value={form.author} onChange={(e) => setForm({ ...form, author: e.target.value })} className="p-2 rounded" style={inputStyle()} />
          <input placeholder="Tema" value={form.tema} onChange={(e) => setForm({ ...form, tema: e.target.value })} className="p-2 rounded" style={inputStyle()} />
          <input placeholder="Total de páginas" type="number" value={form.totalPages} onChange={(e) => setForm({ ...form, totalPages: e.target.value })} className="p-2 rounded" style={inputStyle()} />
          <input placeholder="Páginas já lidas" type="number" value={form.pagesRead} onChange={(e) => setForm({ ...form, pagesRead: e.target.value })} className="p-2 rounded" style={inputStyle()} />
          <button type="submit" className="col-span-2 rounded py-2" style={{ background: C.sage, color: C.bg, ...sans, fontWeight: 500 }}>Adicionar</button>
        </form>
      </Panel>

      <div className="grid md:grid-cols-2 gap-4 mb-6">
        <Panel><SectionTitle sub="Últimas duas semanas">Páginas lidas por dia</SectionTitle><MiniLine data={data.reading.map(r => ({ ...r, date: fmtDate(r.date) }))} dataKey="pages" color={C.sage} /></Panel>
        <Panel><SectionTitle sub="Soma de todos os meses registrados">Páginas por matéria</SectionTitle><MiniBar data={subjectChart} dataKey="pages" color={C.bronze} /></Panel>
      </div>

      <Panel className="mb-6">
        <SectionTitle sub="Habilidades desenvolvidas — filtradas pelo período selecionado">Skills</SectionTitle>
        <div className="flex flex-col gap-2 text-sm" style={sans}>
          {pSkills.map((s) => (
            <div key={s.id} className="flex justify-between" style={{ color: C.text }}>
              <span>{s.nome}{s.nota ? ` — ${s.nota}` : ""}</span>
              <span style={{ color: C.textMuted }}>{s.nivel} · {fmtDate(s.date)}</span>
            </div>
          ))}
          {pSkills.length === 0 && <div style={{ color: C.textMuted }}>Nenhuma skill registrada neste período.</div>}
        </div>
      </Panel>

      <Panel>
        <SectionTitle>Registros do período selecionado</SectionTitle>
        <div className="flex flex-col gap-1 text-sm" style={sans}>
          {pReading.map((r, i) => <div key={"r" + i} className="flex justify-between" style={{ color: C.text }}><span>Leitura</span><span style={{ color: C.textMuted }}>{r.pages} pág. — {fmtDate(r.date)}</span></div>)}
          {pStudy.map((r) => <div key={r.id} className="flex justify-between" style={{ color: C.text }}><span>Estudo — {r.subject}</span><span style={{ color: C.textMuted }}>{r.pages} pág. — {fmtDate(r.date)}</span></div>)}
          {pReading.length === 0 && pStudy.length === 0 && <div style={{ color: C.textMuted }}>Nenhum registro neste período.</div>}
        </div>
      </Panel>
    </div>
  );
}

function Corpo({ data, period }) {
  const totalMinutes = sum(data.exerciseRecords.map((r) => r.minutes));
  const byExercise = {};
  data.exerciseRecords.forEach((r) => { byExercise[r.name] = (byExercise[r.name] || 0) + r.minutes; });
  const exChart = Object.entries(byExercise).map(([name, minutes]) => ({ name, minutes }));

  const pExercise = data.exerciseRecords.filter((r) => inPeriod(r.date, period.value));
  const pSleep = data.sleep.filter((r) => inPeriod(r.date, period.value));
  const pWeight = data.weight.filter((r) => inPeriod(r.date, period.value));

function Tempo({ data, period }) {
  const t = data.time;
  const procrastMinutesTotal = sum(data.procrastinationRecords.map((r) => r.minutes));
  const procrastHoursTotal = procrastMinutesTotal / 60;
  const items = [
    { label: "Trabalho", value: t.trabalho, unit: "h" },
    { label: "Estudo", value: t.estudo, unit: "h" },
    { label: "Exercício", value: t.exercicio, unit: "h" },
    { label: "Lazer", value: t.lazer, unit: "h" },
    { label: "Redes sociais / procrastinação", value: Number(procrastHoursTotal.toFixed(1)), unit: "h" },
  ];
  const total = sum(items.map((i) => i.value));

  const byApp = {};
  data.procrastinationRecords.forEach((r) => { byApp[r.app] = (byApp[r.app] || 0) + r.minutes; });
  const appChart = Object.entries(byApp).map(([name, minutes]) => ({ name, minutes }));

  const pProcrastination = data.procrastinationRecords.filter((r) => inPeriod(r.date, period.value));

  return (
    <div>
      <SectionTitle sub="Onde o tempo realmente foi parar, incluindo redes sociais">Tempo</SectionTitle>
      <PeriodFilter period={period.value} setPeriod={period.set} />
      <Panel className="mb-6">
        <div className="flex flex-col gap-3">
          {items.map((i) => {
            const pct = Math.round((i.value / total) * 100);
            return (<div key={i.label}>
              <div className="flex justify-between text-sm mb-1" style={{ ...sans, color: C.text }}><span>{i.label}</span><span style={{ color: C.textMuted }}>{i.value}{i.unit}</span></div>
              <div className="h-1.5 rounded-full" style={{ background: C.surfaceAlt }}><div className="h-1.5 rounded-full" style={{ width: `${pct}%`, background: i.label.includes("procrastinação") ? C.bronze : C.sage }} /></div>
            </div>);
          })}
        </div>
      </Panel>

      <div className="grid md:grid-cols-2 gap-4 mb-6">
        <Panel><SectionTitle sub="Minutos acumulados, todos os registros">Redes sociais por app</SectionTitle><MiniBar data={appChart} dataKey="minutes" color={C.bronze} /></Panel>
        <Panel>
          <SectionTitle>Registros do período selecionado</SectionTitle>
          <div className="flex flex-col gap-1 text-sm" style={sans}>
            {pProcrastination.map((r) => <div key={r.id} className="flex justify-between" style={{ color: C.text }}><span>{r.app}</span><span style={{ color: C.textMuted }}>{r.minutes} min — {fmtDate(r.date)}</span></div>)}
            {pProcrastination.length === 0 && <div style={{ color: C.textMuted }}>Nenhum registro neste período.</div>}
          </div>
        </Panel>
      </div>
    </div>
  );
}

const COINGECKO_IDS = { SHIB: "shiba-inu", BTC: "bitcoin", ETH: "ethereum", DOGE: "dogecoin", SOL: "solana", ADA: "cardano" };

function Financeiro({ data, hideFinance, setHideFinance, period }) {
  const [prices, setPrices] = useState({});
  const [priceStatus, setPriceStatus] = useState("idle"); // idle | loading | ok | error
  const [quotes, setQuotes] = useState({});
  const [quoteStatus, setQuoteStatus] = useState({});

  const totalBalance = sum(data.accounts.map((a) => a.balance));
  const cryptoHoldings = {};
  data.cryptoPurchases.forEach((p) => { cryptoHoldings[p.coin] = (cryptoHoldings[p.coin] || 0) + p.quantity; });

  async function fetchCryptoPrices() {
    setPriceStatus("loading");
    try {
      const coins = Object.keys(cryptoHoldings).map((c) => COINGECKO_IDS[c]).filter(Boolean);
      if (coins.length === 0) { setPriceStatus("error"); return; }
      const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coins.join(",")}&vs_currencies=brl`);
      const json = await res.json();
      const byTicker = {};
      Object.entries(COINGECKO_IDS).forEach(([ticker, id]) => { if (json[id]) byTicker[ticker] = json[id].brl; });
      setPrices(byTicker);
      setPriceStatus("ok");
    } catch (e) { setPriceStatus("error"); }
  }

  async function fetchQuote(name) {
    setQuoteStatus((s) => ({ ...s, [name]: "loading" }));
    try {
      const ticker = name.split(" ")[name.split(" ").length - 1].replace(/[^A-Za-z0-9]/g, "");
      const res = await fetch(`https://brapi.dev/api/quote/${ticker}`);
      const json = await res.json();
      if (json?.results?.[0]?.regularMarketPrice) {
        setQuotes((q) => ({ ...q, [name]: json.results[0].regularMarketPrice }));
        setQuoteStatus((s) => ({ ...s, [name]: "ok" }));
      } else { setQuoteStatus((s) => ({ ...s, [name]: "error" })); }
    } catch (e) { setQuoteStatus((s) => ({ ...s, [name]: "error" })); }
  }

  const pTx = data.transactions.filter((t) => inPeriod(t.date, period.value));
  const entradasPeriodo = sum(pTx.filter((t) => t.operacao === "Entrada").map((t) => t.valor));
  const saidasPeriodo = sum(pTx.filter((t) => t.operacao === "Saída").map((t) => t.valor));

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <SectionTitle sub="Contas, criptomoedas e investimentos">Financeiro</SectionTitle>
        <button onClick={() => setHideFinance(!hideFinance)} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded" style={{ background: C.surface, color: C.textMuted, border: `1px solid ${C.border}`, ...sans }}>
          {hideFinance ? <Eye size={13} /> : <EyeOff size={13} />} {hideFinance ? "Mostrar valores" : "Ocultar valores"}
        </button>
      </div>
      <PeriodFilter period={period.value} setPeriod={period.set} />

      <div className="grid md:grid-cols-2 gap-4 mb-6">
        <Panel>
          <SectionTitle sub="Total (contas de banco/carteira)">Contas — <PrivacyValue hide={hideFinance}>R$ {totalBalance}</PrivacyValue></SectionTitle>
          <div className="flex flex-col gap-2">
            {data.accounts.map((a) => (<div key={a.id} className="flex justify-between text-sm" style={{ ...sans, color: C.text }}><span>{a.name}</span><span style={{ color: C.textMuted }}><PrivacyValue hide={hideFinance}>R$ {a.balance}</PrivacyValue></span></div>))}
          </div>
        </Panel>
        <Panel>
          <SectionTitle sub="Últimas 4 semanas">Entradas vs. saídas</SectionTitle>
          <GroupedBar data={data.weeklyFlow} keys={["entradas", "saidas"]} colors={[C.sage, C.bronze]} xKey="week" />
        </Panel>
      </div>

      <div className="grid md:grid-cols-2 gap-4 mb-6">
        <Panel>
          <div className="flex items-center justify-between mb-1">
            <div className="flex items-center gap-2" style={{ color: C.bronze }}><Coins size={16} /><span style={{ ...serif, fontSize: 16, color: C.text }}>Criptomoedas</span></div>
            <button onClick={fetchCryptoPrices} className="text-xs px-2 py-1 rounded" style={{ background: C.surfaceAlt, color: C.textMuted, border: `1px solid ${C.border}`, ...sans }}>
              {priceStatus === "loading" ? "Consultando..." : "Consultar preço (CoinGecko)"}
            </button>
          </div>
          <p className="text-xs mb-3" style={{ ...sans, color: C.textMuted }}>Mostra apenas a quantidade — o valor varia e não entra no total de patrimônio. O preço consultado é só referência.</p>
          <div className="flex flex-col gap-2 mb-4">
            {Object.entries(cryptoHoldings).map(([coin, qty]) => (
              <div key={coin} className="flex justify-between text-sm" style={{ ...sans, color: C.text }}>
                <span>{coin}</span>
                <span style={{ color: C.sage }}>{qty.toLocaleString("pt-BR")}{prices[coin] ? <span style={{ color: C.textMuted }}> · ref. R$ {(prices[coin] * qty).toLocaleString("pt-BR", { maximumFractionDigits: 2 })}</span> : ""}</span>
              </div>
            ))}
          </div>
          {priceStatus === "error" && <p className="text-xs mb-2" style={{ ...sans, color: C.danger }}>Não consegui consultar agora (rede ou limite de chamadas). Tente de novo em instantes.</p>}
          <div className="text-xs" style={{ ...sans, color: C.textMuted }}>Histórico de compras (referência de valorização):</div>
          <div className="flex flex-col gap-1 mt-1">
            {data.cryptoPurchases.map((p) => (<div key={p.id} className="flex justify-between text-xs" style={{ ...sans, color: C.textMuted }}><span>{fmtDate(p.date)} — {p.coin}</span><span>R$ {p.brlSpent} → {p.quantity.toLocaleString("pt-BR")}</span></div>))}
          </div>
        </Panel>
        <Panel>
          <div className="flex items-center gap-2 mb-1" style={{ color: C.sage }}><TrendingUp size={16} /><span style={{ ...serif, fontSize: 16, color: C.text }}>Ações / investimentos</span></div>
          <p className="text-xs mb-3" style={{ ...sans, color: C.textMuted }}>Também por quantidade — não entra no total em dinheiro.</p>
          <div className="flex flex-col gap-2">
            {data.investments.map((i) => (
              <div key={i.id} className="flex justify-between items-center text-sm" style={{ ...sans, color: C.text }}>
                <span>{i.name}</span>
                <div className="flex items-center gap-2">
                  <span style={{ color: C.sage }}>{i.quantity}</span>
                  {quotes[i.name] ? <span className="text-xs" style={{ color: C.textMuted }}>R$ {quotes[i.name]}</span> :
                    <button onClick={() => fetchQuote(i.name)} className="text-xs px-2 py-0.5 rounded" style={{ background: C.surfaceAlt, color: C.textMuted, border: `1px solid ${C.border}` }}>
                      {quoteStatus[i.name] === "loading" ? "..." : quoteStatus[i.name] === "error" ? "Indisponível" : "Cotação"}
                    </button>}
                </div>
              </div>
            ))}
          </div>
          <p className="text-xs mt-3" style={{ ...sans, color: C.textMuted }}>Cotação de ações brasileiras via API gratuita — pode ficar indisponível sem uma chave própria; numa versão final vale ter uma fonte paga e um backend cuidando disso.</p>
        </Panel>
      </div>

      <Panel>
        <SectionTitle sub={`Entradas: R$ ${entradasPeriodo} · Saídas: R$ ${saidasPeriodo}`}>Transações do período selecionado</SectionTitle>
        <div className="flex flex-col gap-1 text-sm" style={sans}>
          {pTx.map((t) => (<div key={t.id} className="flex justify-between" style={{ color: C.text }}><span>{t.categoria} — {t.conta}</span><span style={{ color: t.operacao === "Saída" ? C.bronze : C.sage }}><PrivacyValue hide={hideFinance}>{t.operacao === "Saída" ? "-" : "+"}R$ {t.valor} · {fmtDate(t.date)}</PrivacyValue></span></div>))}
          {pTx.length === 0 && <div style={{ color: C.textMuted }}>Nenhuma transação neste período.</div>}
        </div>
      </Panel>
    </div>
  );
}

        ))}
      </div>

      <div className="grid md:grid-cols-2 gap-4 no-print">
        <Panel>
          <SectionTitle>Dados pessoais</SectionTitle>
          <form onSubmit={saveProfile} className="flex flex-col gap-3">
            <input placeholder="Nome completo" value={profileEdit.nome} onChange={(e) => setProfileEdit({ ...profileEdit, nome: e.target.value })} className="p-2 rounded" style={inputStyle()} />
            <input type="date" placeholder="Data de nascimento" value={profileEdit.dataNascimento} onChange={(e) => setProfileEdit({ ...profileEdit, dataNascimento: e.target.value })} className="p-2 rounded" style={inputStyle()} />
            <input placeholder="Telefone" value={profileEdit.telefone} onChange={(e) => setProfileEdit({ ...profileEdit, telefone: e.target.value })} className="p-2 rounded" style={inputStyle()} />
            <input placeholder="Email" value={profileEdit.email} onChange={(e) => setProfileEdit({ ...profileEdit, email: e.target.value })} className="p-2 rounded" style={inputStyle()} />
            <button type="submit" className="rounded py-2" style={{ background: C.sage, color: C.bg, ...sans, fontWeight: 500 }}>Salvar dados</button>
          </form>
        </Panel>

        <Panel>
          <SectionTitle>Adicionar ao currículo</SectionTitle>
          <form onSubmit={addItem} className="flex flex-col gap-3">
            <select value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })} className="w-full p-2 rounded" style={inputStyle()}>
              {["Formação", "Pós-graduação", "Curso", "Certificado", "Idioma", "Experiência"].map((t) => <option key={t}>{t}</option>)}
            </select>
            <input placeholder="Título" value={form.titulo} onChange={(e) => setForm({ ...form, titulo: e.target.value })} className="p-2 rounded" style={inputStyle()} />
            <input placeholder="Instituição / empresa" value={form.instituicao} onChange={(e) => setForm({ ...form, instituicao: e.target.value })} className="p-2 rounded" style={inputStyle()} />
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs block mb-1" style={{ color: C.textMuted, ...sans }}>Início</label><input type="date" value={form.dataInicio} onChange={(e) => setForm({ ...form, dataInicio: e.target.value })} className="w-full p-2 rounded" style={inputStyle()} /></div>
              <div><label className="text-xs block mb-1" style={{ color: C.textMuted, ...sans }}>Fim</label><input type="date" value={form.dataFim} onChange={(e) => setForm({ ...form, dataFim: e.target.value })} className="w-full p-2 rounded" style={inputStyle()} /></div>
            </div>
            {!isFormacao && (<div><label className="text-xs block mb-1" style={{ color: C.textMuted, ...sans }}>Carga horária (horas)</label><input type="number" value={form.horas} onChange={(e) => setForm({ ...form, horas: e.target.value })} className="w-full p-2 rounded" style={inputStyle()} /></div>)}
            {isFormacao && <p className="text-xs" style={{ color: C.textMuted, ...sans }}>Para Formação/Pós-graduação, a duração em anos é calculada a partir das datas.</p>}
            <button type="submit" className="rounded py-2" style={{ background: C.sage, color: C.bg, ...sans, fontWeight: 500 }}>Adicionar</button>
          </form>
        </Panel>
      </div>
    </div>
  );
}

const LANGUAGES = [
  { code: "pt", label: "Português" },
  { code: "en", label: "English" },
  { code: "es", label: "Español" },
  { code: "fr", label: "Français" },
];

function Configuracoes({ lang, setLang, data, setData }) {
  const cfg = data.dashboardConfig;
  const [importMsg, setImportMsg] = useState("");
  function toggle(key) { setData((d) => ({ ...d, dashboardConfig: { ...d.dashboardConfig, [key]: !d.dashboardConfig[key] } })); }
  function setDoacaoModo(modo) { setData((d) => ({ ...d, dashboardConfig: { ...d.dashboardConfig, doacaoModo: modo } })); }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ssmv-backup-${todayIso()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        setData(parsed);
        setImportMsg("Backup carregado com sucesso.");
      } catch (err) { setImportMsg("Não consegui ler esse arquivo — confira se é um JSON exportado daqui."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const toggles = [
    { key: "leitura", label: "Leitura" },
    { key: "exercicio", label: "Exercício" },
    { key: "livros", label: "Livros lidos" },
    { key: "financeiro", label: "Financeiro (saldo total)" },
    { key: "sono", label: "Sono" },
    { key: "peso", label: "Peso" },
    { key: "pressao", label: "Pressão arterial" },
    { key: "estado", label: "Estado de espírito" },
  ];

  return (
    <div>
      <SectionTitle sub="Preferências do sistema">Configurações</SectionTitle>
      <div className="grid md:grid-cols-2 gap-4 mb-4">
        <Panel>
          <div className="flex items-center gap-2 mb-3" style={{ color: C.sage }}><Globe size={16} /><span style={{ ...serif, fontSize: 16, color: C.text }}>Idioma</span></div>
          <select value={lang} onChange={(e) => setLang(e.target.value)} className="w-full p-2 rounded mb-2" style={inputStyle()}>
            {LANGUAGES.map((l) => <option key={l.code} value={l.code}>{l.label}</option>)}
          </select>
          <p className="text-xs" style={{ ...sans, color: C.textMuted }}>Por enquanto a tradução cobre a navegação — as telas completas em outros idiomas são o próximo passo.</p>
        </Panel>
        <Panel style={{ maxWidth: 480 }}>
          <div className="flex flex-col gap-4 text-sm" style={{ ...sans, color: C.text }}>
            <div className="flex justify-between items-center"><span>Módulo de apostas</span><span style={{ color: C.textMuted }}>Desativado</span></div>
            <div className="flex justify-between items-center"><span>Módulo de substâncias</span><span style={{ color: C.textMuted }}>Desativado</span></div>
            <div className="flex justify-between items-center"><span>PIN / biometria</span><span style={{ color: C.textMuted }}>Em breve</span></div>
          </div>
        </Panel>
      </div>

      <Panel>
        <SectionTitle sub="Escolha o que aparece no Dashboard principal — tudo aqui é opcional">Personalizar Dashboard</SectionTitle>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          {toggles.map((t) => (
            <button key={t.key} onClick={() => toggle(t.key)} className="text-xs text-left px-3 py-2 rounded flex items-center justify-between"
              style={{ background: cfg[t.key] ? C.surfaceAlt : "transparent", border: `1px solid ${C.border}`, color: cfg[t.key] ? C.text : C.textMuted, ...sans }}>
              {t.label}<span style={{ color: cfg[t.key] ? C.sage : C.textMuted }}>{cfg[t.key] ? "Ativo" : "Oculto"}</span>
            </button>
          ))}
        </div>
        <div>
          <label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>Card de caridade mostra:</label>
          <select value={cfg.doacaoModo} onChange={(e) => setDoacaoModo(e.target.value)} className="w-full max-w-xs p-2 rounded" style={inputStyle()}>
            <option value="contagem">Só a quantidade de ações</option>
            <option value="valor">O valor doado</option>
            <option value="oculto">Não mostrar no Dashboard</option>
          </select>
        </div>
      </Panel>

      <Panel className="mt-4" style={{ maxWidth: 480 }}>
        <SectionTitle sub="Enquanto não temos banco de dados de verdade, isso é o seu backup">Backup dos dados</SectionTitle>
        <div className="flex flex-col gap-3">
          <button onClick={exportBackup} className="rounded py-2 text-sm" style={{ background: C.sage, color: C.bg, ...sans, fontWeight: 500 }}>Exportar backup (JSON)</button>
          <div>
            <label className="text-xs block mb-1" style={{ ...sans, color: C.textMuted }}>Importar backup (JSON)</label>
            <input type="file" accept="application/json" onChange={importBackup} className="w-full text-xs" style={{ ...sans, color: C.text }} />
          </div>
          {importMsg && <p className="text-xs" style={{ ...sans, color: C.sage }}>{importMsg}</p>}
        </div>
      </Panel>
    </div>
  );
}

const NAV = [
  { id: "dashboard", icon: Home },
  { id: "registrar", icon: PlusCircle },
  { id: "conhecimento", icon: BookOpen },
  { id: "corpo", icon: Activity },
  { id: "tempo", icon: Clock },
  { id: "financeiro", icon: Wallet },
  { id: "caridade", icon: HeartHandshake },
  { id: "relatorios", icon: BarChart3 },
  { id: "curriculo", icon: FileText },
  { id: "configuracoes", icon: Settings },
];
const NAV_I18N = {
  pt: { dashboard: "Dashboard", registrar: "Registrar", conhecimento: "Conhecimento", corpo: "Corpo", tempo: "Tempo", financeiro: "Financeiro", caridade: "Caridade", relatorios: "Relatórios", curriculo: "Currículo", configuracoes: "Configurações", tagline: "Seja Sua Melhor Versão" },
  en: { dashboard: "Dashboard", registrar: "Log", conhecimento: "Knowledge", corpo: "Body", tempo: "Time", financeiro: "Finance", caridade: "Charity", relatorios: "Reports", curriculo: "Résumé", configuracoes: "Settings", tagline: "Be Your Best Version" },
  es: { dashboard: "Panel", registrar: "Registrar", conhecimento: "Conocimiento", corpo: "Cuerpo", tempo: "Tiempo", financeiro: "Finanzas", caridade: "Caridad", relatorios: "Informes", curriculo: "Currículum", configuracoes: "Configuración", tagline: "Sé Tu Mejor Versión" },
  fr: { dashboard: "Tableau de bord", registrar: "Enregistrer", conhecimento: "Connaissance", corpo: "Corps", tempo: "Temps", financeiro: "Finances", caridade: "Charité", relatorios: "Rapports", curriculo: "CV", configuracoes: "Paramètres", tagline: "Devenez Votre Meilleure Version" },
};

function SSMV() {
  const [tab, setTab] = useState("dashboard");
  const [hideFinance, setHideFinance] = useState(true);
  const [data, setData] = useState(initialData);
  const [periodVal, setPeriodVal] = useState({ type: "dia", ref: todayIso() });
  const [lang, setLang] = useState("pt");
  const period = { value: periodVal, set: setPeriodVal };
  const nav = NAV_I18N[lang];

  const Page = useMemo(() => {
    switch (tab) {
      case "registrar": return <Registrar data={data} setData={setData} />;
      case "conhecimento": return <Conhecimento data={data} setData={setData} period={period} />;
      case "corpo": return <Corpo data={data} period={period} />;
      case "tempo": return <Tempo data={data} period={period} />;
      case "financeiro": return <Financeiro data={data} hideFinance={hideFinance} setHideFinance={setHideFinance} period={period} />;
      case "caridade": return <Caridade data={data} period={period} hideFinance={hideFinance} />;
      case "relatorios": return <Relatorios data={data} period={period} />;
      case "curriculo": return <Curriculo data={data} setData={setData} />;
      case "configuracoes": return <Configuracoes lang={lang} setLang={setLang} data={data} setData={setData} />;
      default: return <Dashboard data={data} hideFinance={hideFinance} period={period} />;
    }
  }, [tab, hideFinance, data, periodVal, lang]);

  return (
    <div style={{ background: C.bg, minHeight: "100vh", ...sans }}>
      <style>{FONTS}</style>
      <div className="flex">
        <div className="hidden md:flex flex-col justify-between p-5 shrink-0 no-print" style={{ width: 220, borderRight: `1px solid ${C.border}`, minHeight: "100vh" }}>
          <div>
            <div style={{ ...serif, fontSize: 20, color: C.text }}>SSMV</div>
            <div className="text-xs mb-8" style={{ color: C.textMuted }}>{nav.tagline}</div>
            <nav className="flex flex-col gap-1">
              {NAV.map((n) => {
                const active = tab === n.id;
                return (<button key={n.id} onClick={() => setTab(n.id)} className="flex items-center gap-3 px-3 py-2 rounded text-sm text-left" style={{ background: active ? C.surface : "transparent", color: active ? C.text : C.textMuted }}><n.icon size={15} />{nav[n.id]}</button>);
              })}
            </nav>
          </div>
          <div className="text-xs" style={{ color: C.textMuted }}>{data.profile.nome}</div>
        </div>

        <div className="md:hidden fixed bottom-0 left-0 right-0 z-10 flex justify-around p-2 no-print" style={{ background: C.surface, borderTop: `1px solid ${C.border}` }}>
          {NAV.slice(0, 5).map((n) => (<button key={n.id} onClick={() => setTab(n.id)} style={{ color: tab === n.id ? C.sage : C.textMuted }}><n.icon size={20} /></button>))}
        </div>

        <div className="flex-1 p-6 md:p-10 pb-24 md:pb-10 max-w-5xl">{Page}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SSMV />);
</script>
